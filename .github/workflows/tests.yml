name: Behaviour and quality checks

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      performance:
        description: Run the opt-in memory and latency budgets
        type: boolean
        default: false

jobs:
  functional:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test]'
      - run: make quality test
      - run: python -m pytest -q --test-order-seed=41

  qt:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [pyqt5, pyqt6]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Qt graphics libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libgl1 libopengl0
      - name: Install selected real Qt binding
        run: |
          if [ '${{ matrix.api }}' = pyqt5 ]; then
            python -m pip install '.[test,qt5-test]'
          else
            python -m pip install '.[test,qt6-test]'
          fi
      - run: python -m pytest -q --qt-api=${{ matrix.api }}
      - run: python -m pytest -q --qt-api=${{ matrix.api }} --test-order-seed=41
      - name: Optional performance budgets
        if: github.event_name == 'workflow_dispatch' && inputs.performance
        run: python -m pytest -q --qt-api=${{ matrix.api }} --performance tests/performance
