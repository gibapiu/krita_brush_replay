[project]
name = "krita-brush-replay"
version = "0.1.0"
description = "Record Krita brush strokes and replay their input and settings"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
